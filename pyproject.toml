[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risforge"
version = "0.4.0"
description = "Merge, clean, deduplicate, and enrich RIS bibliographic files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amyr", email = "amyrhexa@gmail.com" }]
keywords = [
    "ris",
    "bibliography",
    "systematic-review",
    "deduplication",
    "enrichment",
    "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
]

dependencies = ["rispy>=0.10.0", "requests>=2.31.0", "requests-cache>=1.2.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "build>=1.2",
    "twine>=5.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/amyrhexa/risforge"
Repository = "https://github.com/amyrhexa/risforge"
Issues = "https://github.com/amyrhexa/risforge/issues"
Changelog = "https://github.com/amyrhexa/risforge/blob/main/CHANGELOG.md"

[project.scripts]
risforge = "risforge.cli:main"

[project.gui-scripts]
risforge-gui = "risforge_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["risforge*", "risforge_gui*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
concurrency = ["thread"]
source = ["risforge", "risforge_gui"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
