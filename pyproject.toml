[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risforge"
version = "0.2.0"
description = "Clean, deduplicate, and enrich RIS bibliographic files for systematic reviews."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amyr", email = "amyrhexa@gmail.com" }
]
keywords = [
    "ris",
    "bibliography",
    "systematic-review",
    "deduplication",
    "crossref",
    "openalex",
    "citation-management",
    "prisma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Filters",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "rispy>=0.9.0",
    "requests>=2.31",
    "requests-cache>=1.1",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/amyr/risforge"
Repository = "https://github.com/amyr/risforge"
Issues = "https://github.com/amyr/risforge/issues"
Changelog = "https://github.com/amyr/risforge/blob/main/CHANGELOG.md"

[project.scripts]
risforge = "risforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
